<!doctype html>
<html class="page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/index.css" />
		<link
			rel="shortcut icon"
			href="./icons/clothes-favicon-32x32.ico"
			type="image/x-icon"
		/>
		<script defer src="./js/promo-banner.js" type="module"></script>
		<title>SHOP.CO</title>
	</head>
	<body class="page__body">
		<div class="promo-banner">
			<div class="promo-banner__header container">
				<p class="promo-banner__text">
					<span class="promo-banner__discount"
						>Зарегистрируйтесь и получите скидку 20% на первую покупку.
					</span>
					<a class="promo-banner__link" href="#">Зарегистрироваться сейчас</a>
				</p>
				<button
					class="promo-banner__button"
					type="button"
					title="Закрыть"
					aria-label="Закрыть"
				>
					<svg width="20" height="20">
						<use
							class="promo-banner__icon"
							href="./icons/sprite.svg#promo-banner"
						></use>
					</svg>
				</button>
			</div>
		</div>
		<header class="header">
			<div class="header__container container">
				<a class="header__logo" href="#" lang="en">SHOP.CO</a>
				<nav class="header__menu menu" aria-label="Главное меню">
					<ul class="menu__list">
						<li class="menu__item">
							<a class="menu__link menu__link--with-arrow" href="#"
								>Магазин
								<svg
									class="menu__arrow"
									width="16"
									height="16"
									aria-hidden="true"
								>
									<use href="./icons/sprite.svg#arrow-header"></use>
								</svg>
							</a>
						</li>
						<li class="menu__item">
							<a class="menu__link" href="#">Скидки</a>
						</li>
						<li class="menu__item">
							<a class="menu__link" href="#new arrivals">Новые поступления</a>
						</li>
						<li class="menu__item">
							<a class="menu__link" href="#brands">Бренды</a>
						</li>
					</ul>
				</nav>
				<search class="header__search" aria-label="Поиск">
					<form class="header__search-form">
						<div class="search">
							<svg
								class="search__icon"
								width="24"
								height="24"
								aria-hidden="true"
							>
								<use href="./icons/sprite.svg#search"></use>
							</svg>
							<input
								class="search__input"
								type="search"
								placeholder="Искать товары..."
								aria-label="Поиск по товарам"
							/>
						</div>
					</form>
				</search>
				<div class="header__actions actions">
					<button
						class="actions__cart-button"
						aria-label="Корзина"
						title="Корзина"
					>
						<svg width="24" height="24">
							<use
								class="actions__cart-icon"
								href="./icons/sprite.svg#cart"
							></use>
						</svg>
					</button>
					<button
						class="actions__account-button"
						aria-label="Личный кабинет"
						title="Личный кабинет"
					>
						<svg width="24" height="24">
							<use
								class="actions__account-icon"
								href="./icons/sprite.svg#account"
							></use>
						</svg>
					</button>
				</div>
			</div>
		</header>
	</body>
</html>
