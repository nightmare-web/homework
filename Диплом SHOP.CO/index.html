<!doctype html>
<html class="page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/index.css" />
		<link
			rel="shortcut icon"
			href="./icons/clothes-favicon-32x32.ico"
			type="image/x-icon"
		/>
		<script src="./js/promo-banner.js" defer></script>
		<title>SHOP.CO</title>
	</head>
	<body class="page__body">
		<section class="promo-banner">
			<div class="promo-banner__container">
				<p class="promo-banner__text">
					Зарегистрируйтесь и получите скидку 20% на первую покупку.
				</p>
				<a href="#" class="promo-banner__link">Зарегистрироваться сейчас</a>
				<button
					type="button"
					class="promo-banner__close"
					aria-label="Закрыть баннер"
				>
					<svg width="20" height="20">
						<use href="./icons/sprite.svg#promo-banner"></use>
					</svg>
				</button>
			</div>
		</section>
		<header class="header">
			<div class="header__container">
				<div class="header__left">
					<a href="#" class="header__logo">SHOP.CO</a>

					<nav class="header__nav">
						<a href="#" class="header__link">
							Магазин
							<svg width="16" height="16" aria-hidden="true">
								<use href="./icons/sprite.svg#arrow-down"></use>
							</svg>
						</a>
						<a href="#" class="header__link">Скидки</a>
						<a href="#" class="header__link">Новые поступления</a>
						<a href="#" class="header__link">Бренды</a>
					</nav>
				</div>

				<div class="header__right">
					<form class="header__search" name="search-form">
						<svg
							class="header__search-icon"
							width="24"
							height="24"
							aria-hidden="true"
						>
							<use href="./icons/sprite.svg#search"></use>
						</svg>
						<input
							type="text"
							class="header__input"
							placeholder="Искать товары..."
						/>
					</form>
					<div class="header__actions">
						<button class="header__icon" aria-label="Корзина">
							<svg width="24" height="24" aria-hidden="true">
								<use href="./icons/sprite.svg#cart"></use>
							</svg>
						</button>
						<button class="header__icon" aria-label="Профиль">
							<svg width="24" height="24" aria-hidden="true">
								<use href="./icons/sprite.svg#account"></use>
							</svg>
						</button>
					</div>
				</div>
			</div>
		</header>
	</body>
</html>
